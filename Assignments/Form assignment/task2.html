<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>
        <legend align="center">Task 2:</legend>
    </h2>
    <fieldset style="width: 350px;" padding="10px">

        <form>
            <h2><b>Pizza Order Form</b></h2>
            <label for="name">First Name: </label>
            <input type="text" name="name" id="name">


            <br>
            <br>

            <label for="lstname">Last Name:</label>
            <input type="text" name="lstname" id="lstname">

            <br>
            <br>

            <label for="email">Email Address:</label>
            <input type="text" name="email" id="email">

            <br>
            <br>

            <label for="cntnumber">Contact Number: </label>
            <input type="number" name="cntnumber" id="cntnumber">

            <br>
            <br>

            <label for="pdd">Preffered Delivery Date: </label>
            <input type="date" name="pdd" id="pdd">

            <br>
            <br>

            Size:
            <br>
            <br>

            <input type="radio" name="small" id="small" value="small">
            <label for="size">Small</label>

            <input type="radio" name="medium" id="medium" value="medium">
            <label for="size">Medium</label>

            <input type="radio" name="large" id="large" value="large">
            <label for="size">Large</label>
            <br>
            <br>

            Flavor:
            <label for="flavor"></label>
            <br>

            <input type="checkbox" name="flavor" id="flavor" value="flavor">
            <label for="flavor">Hawaiian (Php 150.00)</label>
            <select name="quantity" id="quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>

            </select>

            <br>

            <input type="checkbox" name="flavor" id="flavor" value="flavor">
            <label for="flavor">Pepperoni (Php 140.00)</label>
            <select name="quantity" id="quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>

            </select>

            <br>

            <input type="checkbox" name="flavor" id="flavor" value="flavor">
            <label for="flavor">Vegetable (Php 130.00)</label>
            <select name="flavor" id="flavor">
                <option value="nuumber">1</option>
                <option value="2">2</option>
            </select>

            <br>
            <br>

            <label for="ccn">Credit Card Number:</label>
            <input type="number" name="ccn" id="ccn" value="ccn">

            <br>
            <br>

            <label for="pin">PIN:</label>
            <input type="number" name="pin" id="pin" value="pin">

            <br>
            <br>

            Additional Note:
            <br>
            <textarea name="addnote" id="addnote"></textarea>

            <br>
            <br>

            <button>Submit Order</button>
        </form>
    </fieldset>
</body>
</html>
