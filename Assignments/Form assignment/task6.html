    <h2><legend align="center"><u>Doctor Appointment Form</u></legend></h2>

    <table border="0" cellpadding="1" cellspacing="0">
        
        <tr>
            <th rowspan="8"><img src="./Doctor....jpg" alt="width=200px" height="300px"></th>
            <td>Appointment Date 
                <input type="date" name="app" id="app">
            </td>
        </tr>
        <tr>
            <td>Appointment Time 
                <input type="time">
            </td>
        </tr>
        <tr>
            <td>Name 
                <input type="text"name="name" id="name" placeholder="First">
            </td>
            <td><input type="text" placeholder="Last"></td>
        </tr>

        <tr>
            <td>Gender:

                <input type="radio" name="gender" id="gender" >

        </tr>

        <tr>
            <td>Phone
                <input type="number" name="num" id="num"placeholder="####">
            </td>
        </tr>

         <tr>
            <td>Address
                <input type="text" name="city" id="city"placeholder="City">

                <input type="text" name="state" id="state"placeholder="state">
            </td>
        </tr>

        <tr>
            
            <td><li>Your Query</li>
               <textarea name="msg" id="msg"></textarea>

            </td>

        </tr>
       <tr>
        <td rowspan="2">Appointment Type:</td>
        <td colspan="2">
          <div>Select Which appointment type(s) you require</div>
          <input type="checkbox" /> Cervix Checkup<br />
          <input type="checkbox" /> Heart Checkup<br />
          <input type="checkbox" /> Eye Checkup<br />
          <input type="checkbox" /> Hearing Test <br>
        </td>
      </tr>
      <tr>
        <td></td>
        <td><br><button>Send</button></td>
      </tr>
    </table>
