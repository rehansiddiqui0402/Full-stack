<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootstrapComponent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container my-5">
        <h1 class="mb-4">Bootstrap Component Demo</h1>
        
        <div class="alert alert-success" role="alert">
            <h4 class="alert-heading">Well done</h4>
            <p>Successfully created a Bootstrap alert.</p>

            <hr>
            <p class="mb-0">Alert are great for showing important messages to users.</p>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Learn Bootstrap</h5>
                <p class="card-text">Boootstrap helps you build god-looking, responsive web pages quickly.</p>
                <a href="#" class="btn btn-primary">Visit Bootstrap</a>
            </div>
        </div>

        <ul class="list-group mb-4">
            <li class="list-group-item active">HTML</li>
            <li class="list-group-item">CSS</li>
            <li class="list-group-item">JavaScript</li>
        </ul>

        <p class="mb-1">Course progress</p>
        <div class="progress" role="progressbar" aria-label="Course progress" aria -valuenow="70" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" style="width: 70%;">70%</div>
        </div>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->


</body>
</html>
