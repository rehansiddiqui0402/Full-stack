<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Button</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container my-4">
        <h1 class="mb-4">Bootstrap Buttons</h1>

        <h4>Primary, Success and Danger</h4>
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-danger">Danger</button>

        <h4 class="mt-4">Large and Small</h4>
        <button type="button" class="btn btn-primary btn-lg">Large Buttons</button>
        <button type="button" class="btn btn-primary btn-sm">Small Button</button>

        <h4 class="mt-4">Disabled</h4>
        <button type="button" class="btn btn-secondary" disabled>Disabled Button</button>

        <h4 class="mt-4">Full Width (w-100)</h4>
        <button type="button" class="btn btn-primary w-100">Full-width Button</button>

        <h4 class="mt-4">Horizontal Button Group</h4>
        <div class="btn-group" role="group" arial-label="Horizontal group">
            <button type="button" class="btn btn-primary">Left</button>
            <button type="button" class="btn btn-primary">Middle</button>
            <button type="button" class="btn btn-primary">RIght</button>

        </div>

        <h4 class="mt-4">Horizontal Button Group</h4>
        <div class="btn-group-vertical" role="group" arial-label="Vertical group">
            <button type="button" class="btn btn-primary">Top</button>
            <button type="button" class="btn btn-primary">Center</button>
            <button type="button" class="btn btn-primary">Bottom</button>
        </div>
    </div>
</body>
</html>
